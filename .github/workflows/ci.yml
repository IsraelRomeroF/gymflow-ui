name: CI

on:
  push: { branches: [main] }
  pull_request:

# Lo que comparten el panel y el portal (auditoría 8, D-40, bloque 4.10). No
# depende de ningún otro repo: el panel y el portal lo bajan como HERMANO
# (`link:../gymflow-ui`) y ellos comprueban que compila dentro de Next.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.26.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:estilos
      - run: pnpm test:solo
